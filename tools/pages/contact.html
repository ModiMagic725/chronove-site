<!-- CONTACT · dark, minimal, one form -->
<section class="phero">
  <div class="media-fill grade" aria-hidden="true" data-render="scene:contact" data-parallax>{{scene:contact}}</div>
  <div class="wrap phero__body">
    <h1 data-split>Enquire</h1>
    <p class="lead" data-reveal>Tell us about the watch you have in mind, and someone from the bench will reply.</p>
  </div>
</section>

<section class="sec" aria-labelledby="form-h">
  <div class="wrap split" style="align-items:start">
    <div class="c-5 stack"><h2 id="form-h" data-split>Write to us</h2>
      <p class="prose muted">We read every message and reply within two working days. This form is a demonstration: nothing is sent or stored.</p>
      <p class="small"><span class="muted">Geneva</span><br>Rue du Rhône 41</p></div>
    <div class="c-7">
      <form data-demo-form novalidate>
        <div class="field"><label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name" required data-label="Name"></div>
        <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required data-label="Email"></div>
        <div class="field"><label for="c-topic">Topic</label><select id="c-topic" name="topic"><option>Watch enquiry</option><option>Press</option><option>Care and service</option></select></div>
        <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" name="message" rows="5" required data-label="Message" data-min="10"></textarea></div>
        <p style="margin-top:24px"><button class="btn btn--solid magnetic" type="submit">Send message</button></p>
        <p class="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
